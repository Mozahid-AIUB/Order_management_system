services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-order_management}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Bound to loopback: the API reaches Postgres over the compose network,
      # so publishing it to every interface would only expose the database.
      # 5433 avoids clashing with a PostgreSQL already running on the host.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The API waits for this before running migrations.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      # "postgres" is the service name above - Docker resolves it on the
      # shared network, which is why this is not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-order_management}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      # There is no dedicated /health route, and a 404 from the router already
      # proves Nest is up and answering, so anything under 500 counts as alive.
      # The check runs through node because the alpine image carries no curl.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Migrations and the admin seed run before the server listens.
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # The browser reaches the API on the host, not inside the network.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - "3001:3001"
    healthcheck:
      # /login is the one page that renders without a token, so it is the
      # honest signal that Next.js is serving rather than merely running.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/login', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - backend

volumes:
  pgdata:
